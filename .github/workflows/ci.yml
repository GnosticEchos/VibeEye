name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality Checks (Fmt & Clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Servo/Fontconfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Servo/Fontconfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run library tests (without Servo - avoids SpiderMonkey TLS stack overflow)
        run: cargo test --package vibeeye-app --package vibeeye-core

      # Note: CLI and MCP tests require Servo which needs larger stack size.
      # Servo's SpiderMonkey allocates ~8MB TLS per thread, exceeding the
      # default test harness thread stack. Run these only when needed.
      # To test Servo locally: ulimit -s 32768 && cargo test --features servo


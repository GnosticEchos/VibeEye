[workspace]
members = [
    "crates/vibeeye-core",
    "crates/vibeeye-app",
    "crates/vibeeye-cli",
    "crates/vibeeye-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["VibeEye Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnosticEchos/VibeEye"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.54.1", features = ["full"] }

# CLI framework
clap = { version = "4.6.7", features = ["derive"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Browser engine (constrained by spec C-01)
servo = { version = "0.7.0", features = ["webcrypto", "brotli-compression-stream"] }
url = "2.5"
dpi = "0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }

# MCP SDK
rust-mcp-sdk = { version = "2.0.0", features = ["server", "stdio", "macros"] }
rust-mcp-schema = "2.0.0"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Logging/tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# Markdown processing (html-to-markdown-rs handles this now)
html-to-markdown-rs = "3.19.0"

# HTML processing
scraper = "0.29.0"

# Time handling
chrono = { version = "0.4.45", features = ["serde"] }

# Directories
dirs = "6.0"

# Testing
mockall = "0.15.0"
tempfile = "3.19.0"

# Async traits
async-trait = "0.1.92"

# JSON Schema
schemars = { version = "1.2.3", features = ["chrono04"] }

# Database
surrealdb = { version = "4.0.0", default-features = false, features = ["kv-mem", "kv-surrealkv", "protocol-ws", "protocol-http"] }

# Embeddings & progress
indicatif = "0.18.6"
comfy-table = "8.0.1"
dotenvy = "0.15"

# Workspace crates
vibeeye-core = { path = "crates/vibeeye-core" }
vibeeye-app = { path = "crates/vibeeye-app" }



# Increase stack size for tests (SurrealDB in-memory can be stack-heavy)
[profile.test]
opt-level = 1
